name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "43 5 * * *" # nightly: catches reborn-protocol/pygserver-only pushes

jobs:
  test:
    runs-on: ubuntu-latest
    # The pygame client and its offline test fixture run headless.
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      # siblings are not on PyPI; install by path. pygserver is needed at
      # runtime by conftest.py's server fixture (integration tests spawn it).
      # They go under deps/, not the workspace root: a root-level `pygserver`
      # directory is importable from the repo root as a namespace package and
      # shadows the installed pygserver (ImportError on pygserver.config).
      - uses: actions/checkout@v4
        with:
          repository: hosler/reborn-protocol
          path: deps/reborn-protocol
      - uses: actions/checkout@v4
        with:
          repository: hosler/pygserver
          path: deps/pygserver
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # pyReborn's [dev] extra carries the test imports (pygame-ce, Pillow,
      # hypothesis, pytest-asyncio); without them the run fails at collection.
      - run: pip install -e ./deps/reborn-protocol -e ./deps/pygserver -e ".[dev]"
      # syntax errors, undefined names and bad comparisons only: the cheap
      # rules that catch a crash no offline test happens to reach
      - run: flake8 --select=E9,F63,F7,F82 pyreborn game_tester
      # unit + integration; the pygserver fixture self-starts from
      # PYGSERVER_DIR (conftest falls back to the sibling ../pygserver, which
      # doesn't exist in the Actions workspace layout)
      - run: PYGSERVER_DIR="$GITHUB_WORKSPACE/deps/pygserver" pytest

  # Report-only: the error count shows in the job summary and never fails the
  # workflow (continue-on-error). One Python version; pygserver is not needed.
  typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hosler/reborn-protocol
          path: deps/reborn-protocol
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ./deps/reborn-protocol -e ".[dev]"
      # configuration comes from [tool.mypy] in pyproject.toml
      - run: |
          mypy | tee mypy.txt || true
          echo "### mypy: $(tail -1 mypy.txt)" >> "$GITHUB_STEP_SUMMARY"
