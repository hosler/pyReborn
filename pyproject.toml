[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyreborn"
dynamic = ["version"]
description = "Modern Python library for Reborn Online servers with multiple API patterns, async support, and game actions"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "PyReborn Contributors"},
]
keywords = ["reborn", "reborn-online", "game", "networking", "protocol", "client", "library", "async", "builder-pattern", "context-manager"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
]
dependencies = [
    "reborn-protocol",  # Shared protocol library
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "flake8",
    "black",
    "mypy",
    # The test suite imports these directly: the pygame client and its
    # offline fixture (pygame-ce; plain pygame has no wheel for current
    # Pythons and builds without the font module), screenshots (Pillow),
    # property tests (hypothesis) and async tests (pytest-asyncio).
    # pygserver is a test dependency too, installed from its checkout.
    "pygame-ce>=2.4",
    "Pillow",
    "hypothesis>=6.0",
    "pytest-asyncio>=0.21",
]
examples = [
    # No additional dependencies for examples
]

[project.urls]
"Homepage" = "https://github.com/openreborn/pyReborn"
"Bug Reports" = "https://github.com/openreborn/pyReborn/issues"
"Source" = "https://github.com/openreborn/pyReborn"
"Documentation" = "https://github.com/openreborn/pyReborn/blob/main/README.md"

[tool.setuptools.dynamic]
version = {attr = "pyreborn.__version__"}

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["src"] by default)
include = ["pyreborn*"]  # package names should match these glob patterns (["*"] by default)
exclude = ["tests*"]  # exclude packages matching these glob patterns (["tests*"] by default)

[tool.setuptools.package-data]
# Ship the data files the client loads at runtime (tile-type table, corrections,
# bundled font, and the theme's emblem/logo art).
# setuptools package-data globs do NOT recurse - assets/*.png does not match
# assets/baddies/*.png, so each subdirectory needs its own entry.
pyreborn = ["*.json", "*.dat", "assets/*.ttf", "assets/*.png", "assets/baddies/*.png"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
  | foo.py           # also separately exclude a file named foo.py in
                     # the root of the project
)
'''

[tool.mypy]
# Non-blocking report on the game layer (the CI "typecheck" job). The library
# layer is type-used, not reported: follow_imports = "silent".
python_version = "3.11"            # the CI floor; mypy >= 2 rejects 3.8
files = ["pyreborn/game", "pyreborn/pygame_game.py"]
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = false         # the next ratchet step turns this on
show_error_codes = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q -m \"not live\""
testpaths = [
    "tests",
]
markers = [
    "integration: starts a throwaway pygserver (see conftest.py) and exercises it end-to-end via game_tester; no external server needed, but slower than unit tests.",
    "live: requires a hand-started server on a hardcoded host:port; opt-in only, not run by default (run with `-m live`).",
]
